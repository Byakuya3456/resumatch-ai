# ── Nginx reverse proxy configuration for Job Matcher ──────────
events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Maximum payload size for resume uploads (15MB)
    client_max_body_size 15M;

    upstream jobmatcher_backend {
        server api:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Serve static frontend directly or proxy to backend
        location / {
            proxy_pass http://jobmatcher_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 180s;
            proxy_connect_timeout 60s;
        }

        # Health endpoint bypass
        location /health {
            proxy_pass http://jobmatcher_backend/health;
            access_log off;
        }
    }
}
