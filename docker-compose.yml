services:
  # ── 1. Backend Flask API Service ─────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobmatcher_api
    restart: unless-stopped
    environment:
      - PORT=5000
      - FLASK_DEBUG=0
      - MONGODB_URI=mongodb://mongodb:27017/
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - QDRANT_URL=http://qdrant:6333
      - EMBEDDING_MODEL=BAAI/bge-base-en-v1.5
      - HYBRID_SEARCH_ENABLED=1
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - jobmatcher_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── 2. MongoDB Database Service ───────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: jobmatcher_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - jobmatcher_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── 3. Qdrant Vector Database ─────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: jobmatcher_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - jobmatcher_network

  # ── 4. Ollama LLM Service ────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: jobmatcher_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - jobmatcher_network

  # ── 5. Nginx Reverse Proxy ───────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: jobmatcher_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - jobmatcher_network

volumes:
  mongo_data:
  qdrant_storage:
  ollama_models:
  api_uploads:

networks:
  jobmatcher_network:
    driver: bridge
