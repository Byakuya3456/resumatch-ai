services:
  # ── 1. Backend Flask API Service ─────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobmatcher_api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=5000
      - FLASK_DEBUG=0
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/jobmatcher}
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/}
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-hf.co/unsloth/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-hf.co/unsloth/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
      - HYBRID_SEARCH_ENABLED=1
    volumes:
      - api_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - jobmatcher_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── 2. PostgreSQL + pgvector Database ─────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobmatcher_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobmatcher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - jobmatcher_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── 3. MongoDB Database Service (Legacy / Hybrid) ─────────
  mongodb:
    image: mongo:7.0
    container_name: jobmatcher_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - jobmatcher_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ── 3. Qdrant Vector Database ─────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: jobmatcher_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - jobmatcher_network

  # ── 4. Ollama LLM Service ────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: jobmatcher_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - jobmatcher_network

  # ── 5. Nginx Reverse Proxy ───────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: jobmatcher_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - jobmatcher_network

volumes:
  pgdata:
  mongo_data:
  qdrant_storage:
  ollama_models:
  api_uploads:

networks:
  jobmatcher_network:
    driver: bridge
