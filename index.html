<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Job Matcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(30, 30, 46, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            color: #00d9ff;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 0 0 20px rgba(0, 217, 255, 0.3);
        }

        .subtitle {
            text-align: center;
            color: #a0a0a0;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .upload-section {
            background: rgba(40, 40, 60, 0.6);
            border: 2px dashed #00d9ff;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .upload-section:hover {
            border-color: #00ffcc;
            background: rgba(50, 50, 70, 0.7);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 217, 255, 0.2);
        }

        .upload-icon {
            font-size: 3em;
            margin-bottom: 20px;
            color: #00d9ff;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #00d9ff 0%, #0099cc 100%);
            color: #fff;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .file-label:hover {
            background: linear-gradient(135deg, #00ffcc 0%, #00d9ff 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 217, 255, 0.4);
        }

        .file-name {
            display: block;
            margin-top: 15px;
            color: #00ffcc;
            font-size: 0.95em;
        }

        .btn {
            padding: 15px 50px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: block;
            margin: 20px auto;
            width: 100%;
            max-width: 300px;
        }

        .btn:hover {
            background: linear-gradient(135deg, #ff8787 0%, #ff6b8a 100%);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 107, 107, 0.4);
        }

        .btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        .output-section {
            margin: 30px 0;
        }

        .output-label {
            font-size: 1.2em;
            color: #00d9ff;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .output-palette {
            background: rgba(20, 20, 35, 0.8);
            border: 1px solid #00d9ff;
            border-radius: 12px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            min-height: 150px;
        }

        .output-palette::-webkit-scrollbar {
            width: 10px;
        }

        .output-palette::-webkit-scrollbar-track {
            background: rgba(30, 30, 45, 0.5);
            border-radius: 10px;
        }

        .output-palette::-webkit-scrollbar-thumb {
            background: #00d9ff;
            border-radius: 10px;
        }

        .output-palette::-webkit-scrollbar-thumb:hover {
            background: #00ffcc;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            background: linear-gradient(135deg, #00d9ff 0%, #0099cc 100%);
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid rgba(0, 217, 255, 0.2);
        }

        tr:hover {
            background: rgba(0, 217, 255, 0.1);
        }

        .match-score {
            font-weight: 600;
            color: #00ffcc;
        }

        .loading {
            text-align: center;
            color: #00d9ff;
            font-style: italic;
        }

        .error {
            color: #ff6b6b;
            text-align: center;
            padding: 10px;
        }

        .success {
            color: #00ffcc;
            text-align: center;
            padding: 10px;
        }

        .status-message {
            text-align: center;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-weight: 500;
        }

        .generate-btn {
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
        }

        .generate-btn:hover {
            background: linear-gradient(135deg, #5eddd4 0%, #54b09d 100%);
        }

        .rejection-section {
            margin-top: 30px;
            background: rgba(20, 20, 35, 0.8);
            border: 1px solid #ff6b6b;
            border-radius: 12px;
            padding: 20px;
        }

        .rejection-header {
            color: #ff6b6b;
            font-size: 1.2em;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .skill-gaps {
            background: rgba(30, 30, 46, 0.95);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .skill-tag {
            display: inline-block;
            padding: 5px 12px;
            background: rgba(255, 107, 107, 0.2);
            border: 1px solid #ff6b6b;
            border-radius: 15px;
            margin: 3px;
            font-size: 0.9em;
        }

        .suggestion-item {
            padding: 10px;
            border-left: 3px solid #00d9ff;
            margin: 10px 0;
            background: rgba(0, 217, 255, 0.1);
        }

        .rejection-company {
            background: rgba(255, 107, 107, 0.1);
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            border-left: 3px solid #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 AI Job Matcher</h1>
        <p class="subtitle">Upload your resume and find your perfect job match</p>

        <div class="upload-section">
            <div class="upload-icon">📄</div>
            <label for="file-upload" class="file-label">
                Choose Resume (PDF/DOCX)
            </label>
            <input id="file-upload" type="file" accept=".pdf,.docx" />
            <span class="file-name" id="file-name">No file chosen</span>
        </div>

        <button class="btn" id="submit-btn" disabled>
            📤 Submit Resume
        </button>

        <div id="status-area"></div>

        <div class="output-section">
            <div class="output-label">📊 Job Matches</div>
            <div class="output-palette" id="output-palette">
                <p style="color: #888; text-align: center; padding: 40px;">
                    Upload your resume and click "Generate Matches" to see results
                </p>
            </div>
            <button class="btn generate-btn" id="generate-btn" disabled>
                ✨ Generate Matches
            </button>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-upload');
        const fileName = document.getElementById('file-name');
        const submitBtn = document.getElementById('submit-btn');
        const generateBtn = document.getElementById('generate-btn');
        const outputPalette = document.getElementById('output-palette');
        const statusArea = document.getElementById('status-area');
        
        let currentUserId = null;

fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
        fileName.textContent = e.target.files[0].name;
        submitBtn.disabled = false;
        
        // RESET the state when a new file is selected
        currentUserId = null;
        generateBtn.disabled = true;
        outputPalette.innerHTML = '<p style="color: #888; text-align: center; padding: 40px;">Upload your resume and click "Generate Matches" to see results</p>';
    } else {
        fileName.textContent = 'No file chosen';
        submitBtn.disabled = true;
    }
});

submitBtn.addEventListener('click', async () => {
    const file = fileInput.files[0];
    if (!file) return;

    const formData = new FormData();
    formData.append('file', file);

    submitBtn.disabled = true;
    showStatus('Uploading and processing resume...', 'loading');

    try {
        const response = await fetch('http://localhost:5000/upload', {
            method: 'POST',
            body: formData
        });

        const data = await response.json();

        if (response.ok) {
            currentUserId = data.user_id;
            showStatus(`✓ Resume processed successfully! User ID: ${currentUserId}`, 'success');
            generateBtn.disabled = false;
            outputPalette.innerHTML = `
                <p style="color: #00ffcc;">
                    Resume uploaded successfully!<br>
                    Click "Generate Matches" to find suitable jobs.
                </p>
            `;
        } else {
            showStatus(`✗ Error: ${data.error}`, 'error');
            submitBtn.disabled = false;
        }
    } catch (error) {
        showStatus(`✗ Connection error: ${error.message}`, 'error');
        submitBtn.disabled = false;
    }
});

        generateBtn.addEventListener('click', async () => {
            if (!currentUserId) return;

            generateBtn.disabled = true;
            showStatus('Generating job matches...', 'loading');
            outputPalette.innerHTML = '<p class="loading">🔍 Analyzing resume and matching jobs...</p>';

            try {
                const response = await fetch('http://localhost:5000/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ user_id: currentUserId })
                });

                const data = await response.json();
                console.log("Raw data from server:", data);

                if (response.ok) {
                    showStatus('✓ Job matches generated successfully!', 'success');
                    displayResults(data);
                    generateBtn.disabled = false;
                } else {
                    showStatus(`✗ Error: ${data.error}`, 'error');
                    outputPalette.innerHTML = `<p class="error">${data.error}</p>`;
                    generateBtn.disabled = false;
                }
            } catch (error) {
                showStatus(`✗ Connection error: ${error.message}`, 'error');
                outputPalette.innerHTML = `<p class="error">Failed to connect to server</p>`;
                generateBtn.disabled = false;
            }
        });

        function displayResults(data) {
    console.log("Displaying results:", data);
    let outputHTML = '';

    // Handle job matches - FIXED FIELD NAMES
    if (data.matches && data.matches.length > 0) {
        // Show only top 5 matches
        const topMatches = data.matches.slice(0, 5);
        
        const tableHTML = `
            <table>
                <thead>
                    <tr>
                        <th>Company Name</th>
                        <th>Job Title</th>
                        <th>Reason Why</th>
                        <th>Match Score</th>
                    </tr>
                </thead>
                <tbody>
                    ${topMatches.map(match => {
                        // Use correct field names that match backend response
                        const company = match.company_name || match.company || 'N/A';
                        const jobTitle = match.job_title || match.job_role || 'N/A';
                        const reason = match.match_reason || match.reason || 'N/A';
                        const score = match.match_score || 'N/A';
                        
                        return `
                            <tr>
                                <td>${company}</td>
                                <td>${jobTitle}</td>
                                <td>${reason}</td>
                                <td class="match-score">${score}</td>
                            </tr>
                        `;
                    }).join('')}
                </tbody>
            </table>
        `;
        outputHTML += tableHTML;
    } else {
        outputHTML += '<p style="color: #888; text-align: center;">No matching jobs found.</p>';
    }

    // Handle rejection analysis
    if (data.rejection_analysis) {
        const rejectionHTML = `
            <div class="rejection-section">
                <div class="rejection-header">📊 Career Development Insights</div>
                
                <h3 style="color: #ff6b6b; margin: 15px 0;">Potential Challenges</h3>
                <div class="rejection-companies">
                    ${data.rejection_analysis.potential_rejections && data.rejection_analysis.potential_rejections.length > 0 ? 
                        data.rejection_analysis.potential_rejections.map(rejection => {
                            const company = rejection.company || rejection.company_name || 'Unknown Company';
                            const reason = rejection.reason || rejection.rejection_reason || 'Not specified';
                            const skillGaps = rejection.skill_gaps || [];
                            
                            return `
                                <div class="rejection-company">
                                    <strong>${company}</strong>
                                    <p>${reason}</p>
                                    ${skillGaps.length > 0 ? `
                                        <div class="skill-gaps">
                                            Required Skills: ${skillGaps.map(skill => 
                                                `<span class="skill-tag">${skill}</span>`).join('')}
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('') : 
                        '<p>No specific challenges identified.</p>'
                    }
                </div>

                ${data.rejection_analysis.skill_development ? `
                    <h3 style="color: #00d9ff; margin: 15px 0;">Skill Development Recommendations</h3>
                    <div class="skill-gaps">
                        <strong>Critical Skills to Develop:</strong><br>
                        ${data.rejection_analysis.skill_development.critical_missing_skills && 
                          data.rejection_analysis.skill_development.critical_missing_skills.length > 0 ? 
                            data.rejection_analysis.skill_development.critical_missing_skills.map(skill => 
                                `<span class="skill-tag">${skill}</span>`).join('') : 
                            'No specific skills identified'
                        }
                    </div>

                    <div style="margin-top: 20px;">
                        <strong style="color: #00ffcc;">Improvement Suggestions:</strong>
                        ${data.rejection_analysis.skill_development.improvement_suggestions && 
                          data.rejection_analysis.skill_development.improvement_suggestions.length > 0 ? 
                            data.rejection_analysis.skill_development.improvement_suggestions.map(suggestion => 
                                `<div class="suggestion-item">${suggestion}</div>`).join('') : 
                            '<p>No specific suggestions available.</p>'
                        }
                    </div>

                    <div style="margin-top: 20px;">
                        <strong style="color: #00ffcc;">Recommended Certifications:</strong>
                        ${data.rejection_analysis.skill_development.recommended_certifications && 
                          data.rejection_analysis.skill_development.recommended_certifications.length > 0 ? 
                            data.rejection_analysis.skill_development.recommended_certifications.map(cert => 
                                `<div class="suggestion-item">${cert}</div>`).join('') : 
                            '<p>No specific certifications recommended.</p>'
                        }
                    </div>
                ` : ''}
            </div>
        `;
        outputHTML += rejectionHTML;
    }

    outputPalette.innerHTML = outputHTML;
}

        function showStatus(message, type) {
            const className = type === 'loading' ? 'loading' : type === 'error' ? 'error' : 'success';
            statusArea.innerHTML = `<div class="status-message ${className}">${message}</div>`;
            
            if (type !== 'loading') {
                setTimeout(() => {
                    statusArea.innerHTML = '';
                }, 5000);
            }
        }
    </script>
</body>
</html>
