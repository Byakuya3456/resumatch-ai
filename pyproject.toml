[project]
name = "job-matcher"
version = "2.0.0"
description = "Production-grade headless REST API for intelligent resume parsing and job matching using Hybrid RAG and LLM reasoning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "werkzeug>=3.0.1",
    "gunicorn>=22.0.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.1.18",
    "pgvector>=0.2.5",
    "pymongo>=4.6.1",
    "pymupdf4llm>=0.0.17",
    "pdfplumber>=0.11.0",
    "pypdf2>=3.0.1",
    "docx2txt>=0.8",
    "python-docx>=1.1.0",
    "sentence-transformers>=3.0.0",
    "spacy>=3.8.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "rank-bm25>=0.2.2",
    "qdrant-client>=1.9.0",
    "gliner>=0.2.9",
    "requests>=2.31.0",
    "langchain>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.8.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
managed = true
dev-dependencies = []
